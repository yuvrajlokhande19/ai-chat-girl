<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chloe AI - Your Indian Teen Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(148, 163, 184, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.08);
            --accent: #22d3ee;
            --accent-glow: rgba(34, 211, 238, 0.4);
            --pink: #ec4899;
            --purple: #8b5cf6;
            --green: #22c55e;
            --orange: #f97316;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --glass-bg: rgba(255, 255, 255, 0.65);
                --glass-border: rgba(15, 23, 42, 0.1);
                --glass-highlight: rgba(255, 255, 255, 0.5);
                --text: #0f172a;
                --text-muted: #475569;
            }
        }
        body { 
            background: #000; overflow: hidden; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            color: var(--text); 
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }

        /* Glass morphism utility */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 var(--glass-highlight),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
        }
        .glass-strong {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        /* === WAKE MODAL === */
        #wake-modal {
            position: fixed; inset: 0; z-index: 200;
            background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.95) 0%, #000 100%);
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #wake-modal.fade-out {
            opacity: 0; transform: scale(1.05);
            pointer-events: none;
        }
        #wake-modal .particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        #wake-modal .particle {
            position: absolute; border-radius: 50%;
            animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        #wake-modal .content { position: relative; z-index: 1; text-align: center; padding: 0 24px; }
        #wake-modal h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(36px, 6vw, 64px); font-weight: 700; letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent), var(--pink), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 16px;
            animation: titlePulse 3s ease-in-out infinite;
        }
        @keyframes titlePulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.15); }
        }
        #wake-modal p { 
            color: var(--text-muted); font-size: 16px; margin-bottom: 40px; 
            font-weight: 400; max-width: 400px;
        }
        #wake-modal button {
            padding: 18px 56px; background: linear-gradient(135deg, var(--accent), var(--purple));
            color: #0f172a; border: none; border-radius: 100px;
            font-size: 17px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 40px var(--accent-glow), 0 4px 24px rgba(0,0,0,0.3);
            position: relative; overflow: hidden;
        }
        #wake-modal button::before {
            content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
            opacity: 0; transition: opacity 0.3s;
        }
        #wake-modal button:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 60px var(--accent-glow), 0 8px 32px rgba(0,0,0,0.4); }
        #wake-modal button:hover::before { opacity: 1; }
        #wake-modal button:active { transform: translateY(0) scale(0.98); }

        /* === STATUS BADGE === */
        #status-badge {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            padding: 8px 18px; border-radius: 100px; font-size: 12px; font-weight: 600;
            font-family: 'Inter', sans-serif; letter-spacing: 0.05em; text-transform: uppercase;
            display: flex; align-items: center; gap: 8px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.15);
        }
        #status-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
        #status-badge.connected .dot { background: var(--green); animation: pulse 1.5s ease-in-out infinite; }
        #status-badge.error .dot { background: #ef4444; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* === THREE DOT MENU === */
        #three-dot-menu {
            position: fixed; top: 20px; left: 20px; z-index: 150;
        }
        #menu-btn {
            width: 48px; height: 48px; border-radius: 16px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            color: var(--text); transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #menu-btn:hover { background: rgba(30, 41, 59, 0.6); transform: scale(1.05); }
        #menu-btn svg { width: 24px; height: 24px; }
        #menu-dropdown {
            position: absolute; top: 56px; left: 0; min-width: 280px; z-index: 200;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            opacity: 0; visibility: hidden; transform: translateY(-8px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #menu-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
        .menu-section { padding: 8px 0; border-bottom: 1px solid var(--glass-border); }
        .menu-section:last-child { border-bottom: none; }
        .menu-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 8px; padding: 0 8px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .menu-item:hover { background: rgba(148, 163, 184, 0.1); }
        .menu-item svg { width: 20px; height: 20px; color: var(--text-muted); flex-shrink: 0; }
        .menu-item span { font-size: 14px; font-weight: 500; color: var(--text); }
        .menu-item input[type="color"] { width: 36px; height: 36px; border-radius: 8px; border: none; cursor: pointer; padding: 0; background: none; }
        .menu-item input[type="file"] { display: none; }
        .menu-item input[type="text"] { flex: 1; padding: 10px 12px; background: rgba(30, 41, 59, 0.6); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; }
        .menu-item input[type="text"]:focus { border-color: var(--accent); }
        .menu-divider { height: 1px; background: var(--glass-border); margin: 8px 0; }

        /* === ZOOM CONTROLS (top right) === */
        #zoom-controls {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            display: flex; flex-direction: column; gap: 8px;
        }
        .zoom-btn {
            width: 44px; height: 44px; border-radius: 12px; border: none; cursor: pointer;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            color: var(--text); font-size: 20px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .zoom-btn:hover { background: rgba(30, 41, 59, 0.6); transform: scale(1.05); }
        .zoom-btn:active { transform: scale(0.95); }

        /* === DANCE BUTTON === */
        #dance-btn {
            position: fixed; bottom: 100px; right: 24px; z-index: 100;
            padding: 12px 24px; border-radius: 100px; border: none; cursor: pointer;
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: #fff; font-size: 14px; font-weight: 700; font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 24px rgba(236, 72, 153, 0.4), 0 0 0 1px rgba(255,255,255,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; gap: 8px;
        }
        #dance-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 32px rgba(236, 72, 153, 0.5); }
        #dance-btn:active { transform: translateY(0) scale(0.97); }
        #dance-btn svg { width: 18px; height: 18px; }

        /* === CHAT WIDGET (Bottom Right Corner) === */
        #chat-widget {
            position: fixed; bottom: 24px; right: 24px; z-index: 100;
            width: 420px; max-width: calc(100vw - 48px);
            display: flex; flex-direction: column; gap: 12px;
        }
        #chat-window {
            max-height: 380px; overflow-y: auto; padding: 16px;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border); border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex; flex-direction: column; gap: 10px;
        }
        #chat-window::-webkit-scrollbar { width: 4px; }
        #chat-window::-webkit-scrollbar-track { background: transparent; }
        #chat-window::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 2px; border: 3px solid transparent; background-clip: padding-box; }
        .msg { 
            padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5;
            max-width: 85%; animation: msgIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif; font-weight: 400;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-you { 
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.25), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(34, 211, 238, 0.3);
            align-self: flex-end; border-bottom-right-radius: 4px;
        }
        .msg-chloe { 
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.25), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(236, 72, 153, 0.3);
            align-self: flex-start; border-bottom-left-radius: 4px;
        }
        .msg-sys { 
            background: rgba(30, 41, 59, 0.6); border: 1px solid var(--glass-border);
            color: var(--text-muted); font-size: 12px; align-self: center; max-width: 100%;
            text-align: center; padding: 8px 12px; border-radius: 10px;
        }
        .msg-time { font-size: 10px; opacity: 0.5; margin-top: 4px; text-align: right; }

        /* === THINKING ANIMATION (Fluid Color Simulation) === */
        .thinking-animation {
            display: flex; gap: 6px; justify-content: center; padding: 8px 0;
        }
        .thinking-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--pink), var(--purple));
            animation: thinkingPulse 1.2s ease-in-out infinite;
        }
        .thinking-dot:nth-child(1) { animation-delay: 0s; }
        .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes thinkingPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.4); opacity: 1; }
        }
        .thinking-gradient {
            position: absolute; inset: -2px; border-radius: 20px;
            background: linear-gradient(135deg, var(--accent), var(--pink), var(--purple), var(--accent));
            background-size: 300% 300%;
            animation: gradientShift 3s ease infinite;
            opacity: 0.3;
            filter: blur(8px);
            z-index: -1;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .msg.thinking { position: relative; overflow: hidden; }
        .msg.thinking::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, var(--accent), var(--pink), var(--purple), var(--accent));
            background-size: 300% 300%;
            animation: gradientShift 3s ease infinite;
            opacity: 0.15;
            z-index: 0;
        }
        .msg.thinking > * { position: relative; z-index: 1; }

        /* === INPUT BAR (Bottom Center) === */
        #input-bar {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 100;
            width: 680px; max-width: calc(100vw - 48px);
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border); border-radius: 100px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            padding: 6px; display: flex; align-items: center; gap: 8px;
        }
        #input-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow), 0 20px 60px rgba(0,0,0,0.4); }
        #mic-btn {
            width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
            background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px);
            color: var(--green); display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--glass-border);
        }
        #mic-btn:hover { background: rgba(34, 211, 238, 0.2); color: var(--accent); }
        #mic-btn.active { background: linear-gradient(135deg, var(--green), #16a34a); color: #fff; }
        #mic-btn svg { width: 22px; height: 22px; }
        #viz-bar { 
            width: 80px; height: 4px; background: rgba(30, 41, 59, 0.6); border-radius: 2px; overflow: hidden; flex-shrink: 0; 
            border: 1px solid var(--glass-border);
        }
        #viz-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); transition: width 30ms linear; border-radius: 2px; }
        #user-input { 
            flex: 1; padding: 14px 20px; background: transparent; border: none; 
            color: var(--text); font-size: 15px; font-family: 'Inter', sans-serif; outline: none;
            min-width: 0;
        }
        #user-input::placeholder { color: var(--text-muted); opacity: 0.7; }
        #send-btn {
            width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            color: #0f172a; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        #send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 24px var(--accent-glow); }
        #send-btn:active { transform: scale(0.95); }
        #send-btn svg { width: 20px; height: 20px; }

        /* === CHLOE AVATAR INDICATOR === */
        #avatar-status {
            position: fixed; bottom: 100px; left: 24px; z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            padding: 10px 14px;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 14px;
        }
        #avatar-status .avatar-ring {
            width: 56px; height: 56px; border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(135deg, var(--accent), var(--pink), var(--purple)) border-box;
            -webkit-mask: linear-gradient(#fff, #fff) padding-box, linear-gradient(#fff, #fff) border-box;
            -webkit-mask-composite: destination-out; mask-composite: exclude;
            animation: ringRotate 8s linear infinite;
            display: flex; align-items: center; justify-content: center;
        }
        @keyframes ringRotate { to { transform: rotate(360deg); } }
        #avatar-status .avatar-ring svg { width: 28px; height: 28px; color: var(--text); }
        #avatar-status .status-text { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; text-align: center; }

        /* === WAKE MODAL PARTICLES === */
        #wake-modal .particle { background: var(--accent); }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            #chat-widget { width: calc(100vw - 24px); right: 12px; bottom: 12px; }
            #input-bar { width: calc(100vw - 24px); bottom: 12px; border-radius: 16px; }
            #dance-btn { bottom: 90px; right: 12px; padding: 10px 18px; font-size: 13px; }
            #avatar-status { bottom: 90px; left: 12px; }
            #zoom-controls { top: 12px; right: 12px; }
            #three-dot-menu { top: 12px; left: 12px; }
            #status-badge { top: 12px; right: 12px; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- WAKE MODAL -->
    <div id="wake-modal">
        <div class="particles" id="particles"></div>
        <div class="content">
            <h1>Enter the World</h1>
            <p>Your AI companion is waiting for you</p>
            <button id="start-btn">Enter</button>
        </div>
    </div>

    <!-- STATUS -->
    <div id="status-badge">
        <span class="dot"></span>
        <span>Connecting...</span>
    </div>

    <!-- THREE DOT MENU -->
    <div id="three-dot-menu">
        <button id="menu-btn" aria-label="Menu" title="Settings">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <circle cx="12" cy="5" r="1.5" fill="currentColor"/>
                <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                <circle cx="12" cy="19" r="1.5" fill="currentColor"/>
            </svg>
        </button>
        <div id="menu-dropdown">
            <div class="menu-section">
                <div class="menu-label">Background</div>
                <div class="menu-item">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor"/>
                        <circle cx="9" cy="9" r="2" fill="currentColor"/>
                        <path d="M21 15l-5-5L5 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <input type="color" id="bg-color-picker" value="#000000" title="Background Color">
                    <span style="flex:1;text-align:left;font-size:13px;">Solid Color</span>
                </div>
                <div class="menu-item" style="flex-direction:column;gap:8px;align-items:stretch;">
                    <div style="display:flex;gap:8px;align-items:center;">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor"/>
                            <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
                            <path d="M21 15l-5-5L5 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input type="file" id="bg-image-upload" accept="image/*" style="display:none;">
                        <label style="flex:1;cursor:pointer;">
                            <input type="text" id="bg-url-input" placeholder="Image URL (https://...)" style="width:100%;background:transparent;border:none;color:var(--text);font:inherit;outline:none;">
                        </label>
                    </div>
                    <div style="display:flex;gap:8px;">
                        <button id="bg-url-add" class="menu-btn-small" style="padding:8px 16px;background:var(--accent);color:#0f172a;border:none;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;">Add from URL</button>
                        <button id="bg-file-add" class="menu-btn-small" style="padding:8px 16px;background:rgba(148,163,184,0.2);color:var(--text);border:1px solid var(--glass-border);border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;">Upload Image</button>
                    </div>
                </div>
            </div>
            <div class="menu-divider"></div>
            <div class="menu-section">
                <div class="menu-label">Avatar</div>
                <div class="menu-item">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <input type="file" id="vrm-upload" accept=".vrm" style="display:none;">
                    <label style="flex:1;cursor:pointer;">
                        <span style="font-size:13px;font-weight:500;color:var(--text);">Change VRM Model</span>
                    </label>
                </div>
            </div>
            <div class="menu-divider"></div>
            <div class="menu-section">
                <div class="menu-label">Voice</div>
                <div class="menu-item" style="flex-direction:column;gap:8px;align-items:stretch;">
                    <div style="display:flex;align-items:center;gap:12px;">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke="currentColor" stroke-width="2"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke="currentColor" stroke-width="2"/>
                            <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <line x1="8" y1="22" x2="16" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span style="flex:1;text-align:left;font-size:13px;">Voice Engine</span>
                        <select id="voice-engine" style="padding:6px 10px;background:rgba(30,41,59,0.6);border:1px solid var(--glass-border);border-radius:8px;color:var(--text);font:inherit;outline:none;cursor:pointer;">
                            <option value="kokoro">Kokoro (Local, Fast)</option>
                            <option value="browser">Browser SpeechSynthesis (Fallback)</option>
                        </select>
                    </div>
                    <div id="voice-select-container">
                        <!-- Voice options populated by JS based on engine -->
                    </div>
                    <div style="margin-top:8px;padding:10px;background:rgba(30,41,59,0.4);border-radius:8px;border:1px solid var(--glass-border);">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:18px;height:18px;color:var(--accent);">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                            <span style="font-size:12px;font-weight:600;color:var(--text);">Test Voice Sample</span>
                        </div>
                        <input type="text" id="voice-test-text" value="Hello, am Sia! Main aapke liye kya karu?" placeholder="Custom test text..." style="width:100%;padding:8px 12px;background:rgba(30,41,59,0.6);border:1px solid var(--glass-border);border-radius:8px;color:var(--text);font:inherit;outline:none;font-size:12px;">
                        <div style="display:flex;gap:8px;margin-top:8px;">
                            <button id="voice-test-btn" class="menu-btn-small" style="flex:1;padding:8px 16px;background:var(--accent);color:#0f172a;border:none;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;">▶ Play Sample</button>
                            <button id="voice-stop-btn" class="menu-btn-small" style="padding:8px 16px;background:rgba(239,68,68,0.2);color:#ef4444;border:1px solid rgba(239,68,68,0.3);border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;">⏹ Stop</button>
                        </div>
                        <div id="voice-test-status" style="margin-top:6px;font-size:11px;color:var(--text-muted);min-height:16px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ZOOM CONTROLS -->
    <div id="zoom-controls">
        <button class="zoom-btn" id="zoom-in" title="Zoom In" aria-label="Zoom In">+</button>
        <button class="zoom-btn" id="zoom-out" title="Zoom Out" aria-label="Zoom Out">−</button>
    </div>

    <!-- DANCE BUTTON -->
    <button id="dance-btn" title="Dance" aria-label="Dance">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-4-4h-3a4 4 0 0 0-4 4v2"/>
            <circle cx="16" cy="7" r="4"/>
        </svg>
        <span>Dance</span>
    </button>

    <!-- AVATAR STATUS -->
    <div id="avatar-status">
        <div class="avatar-ring">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
            </svg>
        </div>
        <span class="status-text">Chloe Ready</span>
    </div>

    <!-- CHAT WIDGET (Bottom Right) -->
    <div id="chat-widget">
        <div id="chat-window" role="log" aria-live="polite" aria-label="Conversation"></div>
    </div>

    <!-- INPUT BAR (Bottom Center) -->
    <div id="input-bar" role="search">
        <button id="mic-btn" title="Voice Input (Click to Speak)" aria-label="Toggle Microphone">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
                <line x1="8" y1="22" x2="16" y2="22"/>
            </svg>
        </button>
        <div id="viz-bar"><div id="viz-fill"></div></div>
        <input type="text" id="user-input" placeholder="Type or speak... (Hindi, English, Hinglish)" spellcheck="false" autocomplete="off">
        <button id="send-btn" title="Send" aria-label="Send Message">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>

    <script type="module" src="./src/main.js"></script>
    <script>
        // Wake modal particles
        const container = document.getElementById('particles');
        const colors = ['#22d3ee', '#ec4899', '#8b5cf6', '#f97316', '#22c55e'];
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = 2 + Math.random() * 5;
            p.style.cssText = `
                left: ${Math.random() * 100}%;
                width: ${size}px; height: ${size}px;
                animation-duration: ${3 + Math.random() * 4}s;
                animation-delay: ${Math.random() * 5}s;
                background: ${colors[Math.floor(Math.random() * colors.length)]};
            `;
            container.appendChild(p);
        }
    </script>
</body>
</html>
